spring.application.name=jaoRestaurante
server.port=8090

# Expone todos los endpoints
management.endpoints.web.exposure.include=*

# Habilita explícitamente los endpoints individuales
management.endpoint.health.show-details=always
management.endpoint.env.show-values=always
management.endpoint.info.enabled=true

# Habilita el mapeo de las propiedades info.*
management.info.env.enabled=true

# Información personalizada
info.app.name=jaoRestaurante
info.app.version=1.0.0
info.app.description=Aplicación que demuestra el uso de DevTools y Actuator

# Configuración de la base de datos postgresql
spring.datasource.url=jdbc:postgresql://localhost:5432/recetas_bd
spring.datasource.username=postgres
spring.datasource.password=mi_clave_secreta
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# migracion datos flyway
spring.flyway.locations=classpath:db/migration
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=false

# Propiedades JWT
com.jao.jwt.secret-word=RmlybWFfcGFyYV9nZW5lcmFyX2xvc190b2tlbnNfZGVfbWlfSkFPYXBsaWNhY2nDs25SZWNldGFz
com.jao.jwt.expiration-milliseconds=7200000
com.jao.jwt.user-generator=JwtJAORecetasGenerator

# Servicio mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=jaoprogramador@gmail.com
spring.mail.password=${GMAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true